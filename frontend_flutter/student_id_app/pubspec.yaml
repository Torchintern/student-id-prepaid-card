name: student_id_prepaid_card
description: Student ID based prepaid card system with merchant and admin modules
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------------- Media & File Handling ----------------
  image_picker: ^1.0.4
  file_picker: ^8.0.0  
  open_filex: ^4.3.4         

  # ---------------- Firebase ----------------
  firebase_messaging: ^14.7.10

  # ---------------- UI & Icons ----------------
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0

  # ---------------- Networking & Backend ----------------
  http: ^1.2.0
  url_launcher: ^6.2.6

  # ---------------- QR Generation & Scanning ----------------
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6

  # ---------------- Share & Storage ----------------
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

  # ---------------- Charts & Insights ----------------
  fl_chart: ^0.68.0

  # ---------------- Localization & Utilities ----------------
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
